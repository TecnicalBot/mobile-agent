name: EAS Update (OTA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The guard diffs the whole pushed range, so it needs the push's
          # "before" commit even when it is several commits behind the tip.
          fetch-depth: 0

      - name: Check if OTA is safe to publish
        id: guard
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # A push can contain several commits. Diff the entire pushed range:
          # checking only HEAD^..HEAD let a docs-only tip commit hide a JS fix
          # behind it and skip the OTA.
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && [ -n "$AFTER_SHA" ]; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" || true)
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          fi
          echo "$CHANGED"

          # Skip OTA when anything native-impacting changed — those require a new build.
          if echo "$CHANGED" | grep -qE '^(package\.json|app\.json|eas\.json|plugins/|modules/|android/|ios/)'; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "Native-impacting files changed. Skipping OTA — run a new EAS build instead."
            exit 0
          fi

          # Nothing bundled to ship: Markdown is never part of the JS bundle, and
          # catalog/*.json is re-fetched from GitHub raw at runtime (30-min TTL,
          # bundled copy is only the offline fallback), so a catalog-only push
          # reaches devices without an OTA. Mixed pushes (docs + src) still publish.
          if [ -n "$CHANGED" ] && [ -z "$(echo "$CHANGED" | grep -vE '(^catalog/|\.md$)' || true)" ]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/catalog files changed. Skipping OTA — catalogs refresh from GitHub raw."
            exit 0
          fi

          echo "safe=true" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.guard.outputs.safe == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Set up Node.js
        if: steps.guard.outputs.safe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.safe == 'true'
        run: pnpm install --frozen-lockfile

      # Pinned so a surprise eas-cli release can't break the publish step.
      # Bump deliberately after checking its changelog.
      - name: Install EAS CLI
        if: steps.guard.outputs.safe == 'true'
        run: npm install -g eas-cli@25.2.0

      # The commit message goes through env, never through ${{ }} inside the
      # script: GitHub writes env values into the process environment without
      # shell parsing, so quotes, backticks and newlines stay inert. Inlining
      # ${{ github.event.head_commit.message }} here let a " in the message
      # close the shell quote, split the message into extra positional
      # arguments, and make `eas update` exit 1 immediately (run #7).
      - name: Publish OTA update
        if: steps.guard.outputs.safe == 'true'
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 1
          OTA_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          eas update \
            --branch production \
            --platform android \
            --message "${OTA_MESSAGE%%$'\n'*}"

      - name: Skip OTA
        if: steps.guard.outputs.safe == 'false'
        run: echo "OTA skipped due to native-impacting changes in this push."
